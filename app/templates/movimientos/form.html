{% extends "base.html" %}

{% block title %}{{ 'Editar' if movimiento else 'Nuevo' }} Movimiento - Finanzas Personales{% endblock %}

{% block content %}
<header>
    <h1>{{ 'Editar' if movimiento else 'Nuevo' }} Movimiento</h1>
</header>

<article>
    <form method="post" class="form-compact">
        <!-- Fila 1: Fecha, Monto, Categoría, Cuenta -->
        <div class="grid">
            <label>
                Fecha *
                <input type="date" name="fecha" value="{{ fecha_default }}" required>
            </label>
            <label>
                Monto *
                <input type="number" name="monto" step="0.01" min="0.01"
                       value="{{ movimiento.monto if movimiento else '' }}"
                       placeholder="0.00" required>
            </label>
        </div>

        <div class="grid">
            <label>
                Categoria *
                <select name="categoria_id" required>
                    <option value="">Seleccionar...</option>
                    <optgroup label="Ingresos">
                        {% for cat in categorias if cat.tipo == 'ingreso' %}
                            <option value="{{ cat.id }}"
                                    {{ 'selected' if movimiento and movimiento.categoria_id == cat.id }}>
                                {{ cat.icono or '' }} {{ cat.nombre }}
                            </option>
                        {% endfor %}
                    </optgroup>
                    <optgroup label="Gastos">
                        {% for cat in categorias if cat.tipo == 'gasto' %}
                            <option value="{{ cat.id }}"
                                    {{ 'selected' if movimiento and movimiento.categoria_id == cat.id }}>
                                {{ cat.icono or '' }} {{ cat.nombre }}
                            </option>
                        {% endfor %}
                    </optgroup>
                </select>
            </label>
            <label>
                Cuenta *
                <select name="cuenta_id" required>
                    <option value="">Seleccionar...</option>
                    {% for cta in cuentas %}
                        <option value="{{ cta.id }}"
                                {{ 'selected' if movimiento and movimiento.cuenta_id == cta.id }}>
                            {{ cta.nombre }}
                        </option>
                    {% endfor %}
                </select>
            </label>
        </div>

        <!-- Descripción -->
        <label>
            Descripcion
            <input type="text" name="descripcion"
                   value="{{ movimiento.descripcion or '' if movimiento else '' }}"
                   placeholder="Breve descripcion (opcional)">
        </label>

        <!-- Sección colapsable para campos opcionales -->
        <details>
            <summary class="text-small">Mas opciones</summary>
            <div style="padding-top: 0.5rem;">
                <label>
                    Etiquetas
                    <input type="text" name="etiquetas"
                           value="{{ movimiento.etiquetas | join(', ') if movimiento and movimiento.etiquetas else '' }}"
                           placeholder="Separadas por comas">
                </label>

                <label>
                    Notas
                    <textarea name="notas" rows="2" placeholder="Notas adicionales">{{ movimiento.notas or '' if movimiento else '' }}</textarea>
                </label>
            </div>
        </details>

        <!-- Botones -->
        <div class="grid" style="margin-top: 1rem;">
            <button type="submit" class="compact">{{ 'Actualizar' if movimiento else 'Guardar' }}</button>
            <a href="{{ url_for('movimientos.listar') }}" role="button" class="secondary compact">Cancelar</a>
        </div>
    </form>
</article>
{% endblock %}
